[project]
name = "aula-classificacao"
version = "0.1.0"
description = "Aula introdutória de classificação com scikit-learn"
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy>=2.5,<3",
    "pandas>=3.0,<4",
    "matplotlib>=3.11,<4",
    "scikit-learn>=1.9,<2",
    "ipykernel>=7.3,<8",
]

[dependency-groups]
dev = [
    "nbformat>=5.11,<6",
    "nbclient>=0.11,<1",
]

[tool.uv]
package = false
